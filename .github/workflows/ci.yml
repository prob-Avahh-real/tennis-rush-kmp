# ─────────────────────────────────────────────────────
# 拉歌 (LaGe) — CI 构建 + 部署脚本
# ─────────────────────────────────────────────────────

name: LaGe CI/CD — Android + iOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  # ═══════════════════════════════════════════════════════
  # Android
  # ═══════════════════════════════════════════════════════

  android-build:
    name: Android Build + APK Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Check APK Size (must be < 30 MB)
        run: |
          SIZE=$(stat -c%s composeApp/build/outputs/apk/release/composeApp-release.apk)
          echo "APK size: $((SIZE / 1024 / 1024)) MB"
          if [ $SIZE -gt 31457280 ]; then
            echo "❌ APK too large: $((SIZE / 1024 / 1024)) MB"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lage-android
          path: composeApp/build/outputs/apk/release/*.apk

  # ═══════════════════════════════════════════════════════
  # iOS
  # ═══════════════════════════════════════════════════════

  ios-build:
    name: iOS Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build iOS Framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Archive iOS App
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS' \
            -archivePath iosApp.xcarchive \
            CODE_SIGN_STYLE=Automatic

  # ═══════════════════════════════════════════════════════
  # 性能检查
  # ═══════════════════════════════════════════════════════

  perf-check:
    name: Performance Baseline Check
    runs-on: ubuntu-latest
    needs: [android-build]
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: ./gradlew :shared:lint :composeApp:lint

      - name: Run unit tests
        run: ./gradlew :shared:test

      # 验证 ProGuard 规则
      - name: Verify ProGuard Rules
        run: |
          echo "ProGuard rules:"
          wc -l composeApp/proguard-rules.pro
          grep -c "keep" composeApp/proguard-rules.pro
